name: Fork hotfix image

on:
  push:
    branches: [fix/v025-leere-datenbank]

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'grafdon/pgcopydb-operator'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PGCOPYDB_TEST_PGURI: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Lint the fork workflow
        run: |
          python3 -m pip install --quiet yamllint
          yamllint --strict .github/workflows/fork-hotfix.yml
      - name: Verify compare and drain regressions
        run: >-
          go test ./internal/controller -count=1 -v
          -run '^(TestCompareDataScript|TestCompareDataQuery|TestEmptyDatabaseQuery|TestVerifyScript|TestBuildCompareJob_Shapes)'
      - name: Compile the cluster E2E specs without running them
        run: go test ./test/e2e -run '^$'

  image:
    needs: test
    if: github.repository == 'grafdon/pgcopydb-operator'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/grafdon/pgcopydb-operator
      VERSION: v0.25.0-empty-db-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/grafdon/pgcopydb-operator
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: Verify the published image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          docker run --rm "$IMAGE@$DIGEST" --help >/dev/null
          echo "Published operator: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
