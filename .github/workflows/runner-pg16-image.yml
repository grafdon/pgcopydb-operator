name: Runner image PG16

# Builds images/runner-pg16 (runner with PostgreSQL 16 client tools, for targets
# older than PostgreSQL 17) and publishes it to this repository's ghcr.io
# namespace. Hosted runner, because the upstream runner scale set does not
# exist in a fork. Manual or on a tag of the form runner-pg16-v*.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, for example v0.25.0-pg16"
        required: true
        default: "v0.25.0-pg16"
        type: string
  push:
    tags: ["runner-pg16-v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/runner-pg16

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "value=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#runner-pg16-}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/runner-pg16
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
